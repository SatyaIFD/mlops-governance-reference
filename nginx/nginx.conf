events {
    worker_connections 1024;
}
http {
    map $http_x_traffic_source $sim_traffic_source {
        default                               "synthetic_representative_simulation";
        "synthetic_representative_simulation" "synthetic_representative_simulation";
        "synthetic_stress_simulation"         "synthetic_stress_simulation";
    }

    server {
        listen 80;

        location = /healthz {
            access_log off;
            return 200 '{"status":"HEALTHY"}\n';
            add_header Content-Type application/json;
        }

        location /api/v1/fraud/ {
            proxy_pass http://mlops-fraud-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/loan/ {
            proxy_pass http://mlops-loan-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Traffic-Source "live_production_traffic";
        }
    }

    # Unpublished internal/loopback-only simulation listener (port 8081)
    server {
        listen 8081;

        location /api/v1/loan-sim/ {
            proxy_pass http://mlops-loan-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Traffic-Source $sim_traffic_source;
        }
    }
}
