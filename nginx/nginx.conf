events {
    worker_connections 1024;
}
http {
    server {
        listen 80;
        location /api/v1/fraud/ {
            proxy_pass http://fraud-detection-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/loan/ {
            proxy_pass http://loan-default-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
