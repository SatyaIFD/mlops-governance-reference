events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Project 1: Credit Card Fraud API
        location /api/v1/fraud/ {
            proxy_pass http://fraud-detection-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Project 2: Loan Default API
        location /api/v1/loan/ {
            proxy_pass http://loan-default-api:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Project 3: AML Streaming API
        location /api/v1/aml/ {
            proxy_pass http://aml-streaming-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
