[project]
name = "mlops-governance-reference"
version = "0.5.20"
description = "Enterprise MLOps Governance & Observability Monorepo"
authors = [{name = "SatyaIFD"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
