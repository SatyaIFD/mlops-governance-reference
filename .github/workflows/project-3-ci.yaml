name: Project 3 Streaming Pipeline CI/CD

on:
  push:
    paths:
      - 'project-3-aml-streaming/**'
      - '.github/workflows/project-3-ci.yaml'
  pull_request:
    paths:
      - 'project-3-aml-streaming/**'

jobs:
  continuous-deployment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Initialize Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Core Pipeline & Gate Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-3-aml-streaming/requirements.txt time-machine anyio hydra-core pdoc pytest hypothesis faker pyarrow bandit ruff==0.11.2

    - name: Run Ruff, Bandit SAST, Unit & Compliance Gates
      run: |
        ruff check project-3-aml-streaming/ compliance/
        ruff format --check project-3-aml-streaming/ compliance/
        bandit -c pyproject.toml -r compliance/ project-3-aml-streaming/src/ -ll
        PYTHONPATH=project-3-aml-streaming pytest project-3-aml-streaming/tests/ -v
        python -m pytest compliance/test_compliance.py -v

    - name: Auto-Generate Technical API Documentation
      run: |
        PYTHONPATH=project-3-aml-streaming pdoc project-3-aml-streaming/src/ -o project-3-aml-streaming/docs/api/

    - name: Enforce Operational Directory Structures
      run: |
        mkdir -p project-3-aml-streaming/data
        mkdir -p project-3-aml-streaming/artifacts

    - name: Build Docker Container
      run: |
        REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_ID="ghcr.io/$REPO/aml-stream-api"
        docker build -t $IMAGE_ID:latest -f project-3-aml-streaming/Dockerfile .

    - name: Run Trivy Container Vulnerability Gate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'ghcr.io/satyaifd/mlops-governance-reference/aml-stream-api:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        trivyignores: '.trivyignore'

    - name: Log in to GitHub Container Registry (GHCR)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Verified Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_ID="ghcr.io/$REPO/aml-stream-api"
        docker push $IMAGE_ID:latest
        docker tag $IMAGE_ID:latest $IMAGE_ID:${{ github.sha }}
        docker push $IMAGE_ID:${{ github.sha }}
