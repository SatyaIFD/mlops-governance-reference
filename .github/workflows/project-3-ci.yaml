name: Project 3 Streaming Pipeline CI

on:
  push:
    paths:
      - 'project-3-aml-streaming/**'
      - '.github/workflows/project-3-ci.yaml'
  pull_request:
    paths:
      - 'project-3-aml-streaming/**'

jobs:
  continuous-integration:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Initialize Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Core Pipeline Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-3-aml-streaming/requirements.txt time-machine anyio hydra-core pdoc pytest

    - name: Execute Governance Validation Test Suite
      run: |
        PYTHONPATH=project-3-aml-streaming pytest project-3-aml-streaming/tests/

    - name: Auto-Generate Technical API Documentation
      run: |
        pdoc project-3-aml-streaming/src/ -o project-3-aml-streaming/docs/api/
        
    - name: Enforce Operational Directory Structures
      run: |
        mkdir -p project-3-aml-streaming/data
        mkdir -p project-3-aml-streaming/artifacts
        
    - name: Build Docker Container
      run: |
        docker build -t aml-stream-api:ci -f project-3-aml-streaming/Dockerfile project-3-aml-streaming/
