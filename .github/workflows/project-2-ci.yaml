name: Project 2 - Loan Default Governance Validation CI

on:
  push:
    branches: [ main ]
    paths:
      - 'project-2-loan-default/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-2-loan-default/**'

jobs:
  governance-audit:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Initialize Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-2-loan-default/requirements.txt pytest httpx kaggle

    - name: Enforce Operational Directory Structures
      run: |
        mkdir -p project-2-loan-default/artifacts
        mkdir -p project-2-loan-default/docs

    - name: Train Model & Populate MLflow Registry
      run: |
        PYTHONPATH=project-2-loan-default python project-2-loan-default/src/training/train.py

    - name: Validate Statistical Population Drift Integrity (PSI)
      run: |
        PYTHONPATH=project-2-loan-default python project-2-loan-default/src/validation/drift_check.py

    - name: Verify Automated Governance Card Compilation
      run: |
        PYTHONPATH=project-2-loan-default python project-2-loan-default/src/governance/audit.py

    - name: Execute Pytest Regression Suite
      env:
        PYTHONPATH: project-2-loan-default
      run: |
        cd project-2-loan-default
        python -m pytest tests/

    - name: Build and Validate Lean Docker Container (Dynamic Context)
      run: |
        docker build -t loan-default-api:ci -f project-2-loan-default/docker/Dockerfile project-2-loan-default/
        docker run -d --name loan-api-ci \
          -v $(pwd)/project-2-loan-default/mlflow.db:/app/mlflow.db \
          -v $(pwd)/project-2-loan-default/mlruns:/app/mlruns \
          -p 5002:8000 loan-default-api:ci
        sleep 5
        curl -s http://localhost:5002/health
        curl -s -X POST "http://localhost:5002/predict" \
             -H "Content-Type: application/json" \
             -d '{"Age": 25, "Income": 55000, "CreditScore": 680, "LoanAmount": 15000, "DTIRatio": 0.35, "MonthsEmployed": 24, "InterestRate": 5.4, "NumCreditLines": 3, "LoanTerm": 36, "Education": "Bachelor'\''s", "EmploymentType": "Full-time", "MaritalStatus": "Single", "HasMortgage": "No", "HasDependents": "No", "LoanPurpose": "Auto", "HasCoSigner": "Yes"}'
        docker rm -f loan-api-ci
