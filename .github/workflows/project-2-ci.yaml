name: Project 2 Loan Default CI/CD

on:
  push:
    paths:
      - 'project-2-loan-default/**'
      - '.github/workflows/project-2-ci.yaml'
  pull_request:
    paths:
      - 'project-2-loan-default/**'

jobs:
  continuous-deployment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Initialize Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Core Pipeline & Gate Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-2-loan-default/requirements.txt pytest httpx kaggle hypothesis faker bandit ruff==0.11.2

    - name: Run Ruff, Bandit SAST, Unit & Compliance Gates
      run: |
        ruff check project-2-loan-default/ compliance/
        ruff format --check project-2-loan-default/ compliance/
        bandit -c pyproject.toml -r compliance/ project-2-loan-default/src/ -ll
        PYTHONPATH=project-2-loan-default pytest project-2-loan-default/tests/ -v
        python -m pytest compliance/test_compliance.py -v

    - name: Build Docker Container
      run: |
        REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_ID="ghcr.io/$REPO/loan-default-job"
        docker build -t $IMAGE_ID:latest -f project-2-loan-default/Dockerfile .

    - name: Run Trivy Container Vulnerability Gate
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'ghcr.io/${{ github.repository_owner }}/mlops-governance-reference/loan-default-job:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        trivyignores: '.trivyignore'

    - name: Log in to GitHub Container Registry (GHCR)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Verified Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_ID="ghcr.io/$REPO/loan-default-job"
        docker push $IMAGE_ID:latest
        docker tag $IMAGE_ID:latest $IMAGE_ID:${{ github.sha }}
        docker push $IMAGE_ID:${{ github.sha }}
