name: Regulatory Compliance Audit

on:
  push:
    branches: [ "main" ]
    paths:
      - 'compliance/**'
      - '.github/workflows/compliance-tests.yml'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  governance-audit:
    name: EU AI Act, GDPR & DORA Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Monorepo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Governance Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest>=8.0.0" "pandas>=2.0.0,<3.0.0" "numpy==2.4.6" "hypothesis>=6.100.0" "faker>=24.0.0" "pyarrow>=15.0.0"

    - name: Execute Dynamic Testing Engine
      run: |
        python -m pytest compliance/test_compliance.py -v
