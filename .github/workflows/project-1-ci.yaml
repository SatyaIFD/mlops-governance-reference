name: Project 1 - Credit Card Fraud CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'project-1-credit-card-fraud/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-1-credit-card-fraud/**'

jobs:
  integration-tests:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-1-credit-card-fraud/requirements.txt

    - name: Initialize CI Test SQLite Ledger & Model Artifacts
      run: |
        mkdir -p project-1-credit-card-fraud/data/processed
        PYTHONPATH=project-1-credit-card-fraud python project-1-credit-card-fraud/src/training/train.py

    - name: Execute Pytest Regression Suite
      env:
        PYTHONPATH: project-1-credit-card-fraud
      run: |
        cd project-1-credit-card-fraud
        python -m pytest tests/

    - name: Build and Validate Docker Container
      run: |
        docker build -t fraud-detection-api:ci -f project-1-credit-card-fraud/docker/Dockerfile .
        docker run -d --name fraud-api-ci -p 5001:5001 fraud-detection-api:ci
        sleep 4
        curl -s http://localhost:5001/health
        curl -s -X POST "http://localhost:5001/predict" \
             -H "Content-Type: application/json" \
             -d '{"features": [0.0, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, -1.35, 85.00]}'
        docker rm -f fraud-api-ci
