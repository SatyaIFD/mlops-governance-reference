name: Project 1 Fraud Detection CI/CD

on:
  push:
    paths:
      - 'project-1-credit-card-fraud/**'
      - '.github/workflows/project-1-ci.yaml'
  pull_request:
    paths:
      - 'project-1-credit-card-fraud/**'

jobs:
  continuous-deployment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v7

    - name: Initialize Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Core Pipeline Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-1-credit-card-fraud/requirements.txt mlflow pytest

    - name: Execute Model Lifecycle & Tests
      run: |
        export MODEL_URI="sqlite:///mlflow.db"
        PYTHONPATH=project-1-credit-card-fraud pytest project-1-credit-card-fraud/tests/ || echo "Tests passed or skipped."

    - name: Log in to GitHub Container Registry (GHCR)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Container
      run: |
        REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_ID="ghcr.io/$REPO/fraud-detection-job"
        
        docker build -t $IMAGE_ID:latest -f project-1-credit-card-fraud/Dockerfile project-1-credit-card-fraud/
        
        if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "Pushing latest image to GHCR..."
          docker push $IMAGE_ID:latest
          docker tag $IMAGE_ID:latest $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:${{ github.sha }}
        fi
