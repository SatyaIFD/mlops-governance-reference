name: Project 1 - Credit Card Fraud CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'project-1-credit-card-fraud/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-1-credit-card-fraud/**'

jobs:
  integration-tests:
    runs-on: ubuntu-24.04  # Explicitly matches your updated stable LTS platform environment

    steps:
    # 1. Checkout repository code
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 2. Setup production runtime Python matrix
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # 3. Install core framework requirements
    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r project-1-credit-card-fraud/requirements.txt
        pip install pytest fastapi httpx

    # 4. Mock execution patch: Setup temporary workspace data structures for the CI runner context
    - name: Initialize CI Test SQLite Ledger
      run: |
        mkdir -p project-1-credit-card-fraud/data/processed
        # Setup temporary mock local paths for test client file overrides
        sed -i 's|/media/storage/mlops-governance-reference/mlflow.db|/home/runner/work/mlops-governance-reference/mlops-governance-reference/project-1-credit-card-fraud/mlflow.db|g' project-1-credit-card-fraud/tests/test_inference.py
        
        # Execute automated headless training to populate the ephemeral mlflow.db inside the runner
        PYTHONPATH=project-1-credit-card-fraud python project-1-credit-card-fraud/src/training/train.py

    # 5. Execute core automated software integration testing pipeline matrix
    - name: Execute Pytest Regression Suite
      env:
        PYTHONPATH: project-1-credit-card-fraud
      run: |
        cd project-1-credit-card-fraud
        python -m pytest tests/