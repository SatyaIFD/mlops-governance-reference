name: Global CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Security & Lint Tools
        run: pip install bandit==1.9.4 ruff==0.11.2

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run SAST Scanner
        run: make security

  compliance-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install pytest uv
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -r project-1-credit-card-fraud/requirements.txt
          uv pip install --system -r project-2-loan-default/requirements.txt
          uv pip install --system -r project-3-aml-streaming/requirements.txt

      - name: Run Full Monorepo Test Suite
        run: make test

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Fleet Build
        env:
          EXPECTED_API_KEY: ci-build-verification-key
          AML_HMAC_SECRET_KEY: ci-build-verification-hmac
          LOAN_HMAC_SECRET_KEY: ci-build-verification-loan-hmac
        run: docker compose build
