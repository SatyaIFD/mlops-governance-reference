name: DevSecOps Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-sast:
    name: Python Static Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Bandit
        run: pip install bandit==1.9.4
      - name: Run Bandit Security Scan
        run: bandit -c pyproject.toml -r compliance/ project-1-credit-card-fraud/src/ project-2-loan-default/src/ project-3-aml-streaming/src/ -ll

  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build service images for scanning
        run: |
          docker build -t fraud-security-test -f project-1-credit-card-fraud/Dockerfile .
          docker build -t loan-security-test -f project-2-loan-default/Dockerfile .
          docker build -t aml-security-test -f project-3-aml-streaming/Dockerfile .
          docker build -t mlflow-security-test -f mlflow.Dockerfile .

      - name: Run Trivy Vulnerability Scanner (Project 1 - Fraud)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'fraud-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Run Trivy Vulnerability Scanner (Project 2 - Loan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'loan-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Run Trivy Vulnerability Scanner (Project 3 - AML)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'aml-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Run Trivy Vulnerability Scanner (MLflow Server)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mlflow-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Run Trivy Vulnerability Scanner (Airflow Standalone)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'apache/airflow:2.10.2'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified MLflow Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID="ghcr.io/$REPO/mlflow-server"
          docker tag mlflow-security-test $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
          docker tag mlflow-security-test $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:${{ github.sha }}
