name: DevSecOps Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-sast:
    name: Python Static Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Scan
        run: bandit -r compliance/ project-1-credit-card-fraud/src/ project-2-loan-default/src/ project-3-aml-streaming/src/ -ll

  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all 3 service images for scanning
        run: |
          docker build -t fraud-security-test -f project-1-credit-card-fraud/Dockerfile .
          docker build -t loan-security-test -f project-2-loan-default/Dockerfile .
          docker build -t aml-security-test -f project-3-aml-streaming/Dockerfile .

      - name: Run Trivy Vulnerability Scanner (Project 1 - Fraud)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'fraud-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Project 2 - Loan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'loan-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Project 3 - AML)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'aml-security-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
