version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/project-1-credit-card-fraud"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      project-1-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/project-2-loan-default"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      project-2-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/project-3-aml-streaming"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      project-3-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/project-1-credit-card-fraud"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14.a0"]

  - package-ecosystem: "docker"
    directory: "/project-2-loan-default"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14.a0"]

  - package-ecosystem: "docker"
    directory: "/project-3-aml-streaming"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14.a0"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
