name: mlops-governance-reference
services:
  api-gateway:
    image: nginx:1.29-alpine
    container_name: mlops-api-gateway
    ports:
      - "80:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fraud-detection-api:
        condition: service_healthy
      loan-default-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  fraud-detection-api:
    build:
      context: .
      dockerfile: project-1-credit-card-fraud/Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/fraud-detection-job:latest
    container_name: mlops-fraud-api
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      - "1000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow.db
      - EXPECTED_API_KEY=${EXPECTED_API_KEY:?EXPECTED_API_KEY must be set in .env or environment}
    volumes:
      - ./mlflow.db:/mlflow.db:ro
      - ./mlruns:/app/mlruns:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  loan-default-api:
    build:
      context: .
      dockerfile: project-2-loan-default/Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/loan-default-job:latest
    container_name: mlops-loan-api
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      - "1000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow.db
      - EXPECTED_API_KEY=${EXPECTED_API_KEY:?EXPECTED_API_KEY must be set in .env or environment}
      - LOAN_TELEMETRY_LOG_PATH=/app/artifacts/telemetry_logs.jsonl
      - LOAN_HMAC_SECRET_KEY=${LOAN_HMAC_SECRET_KEY:?LOAN_HMAC_SECRET_KEY must be set in .env or environment}
    volumes:
      - ./mlflow.db:/mlflow.db:ro
      - ./mlruns:/app/mlruns:ro
      - ./project-2-loan-default/artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  aml-streaming-api:
    build:
      context: .
      dockerfile: project-3-aml-streaming/Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/aml-stream-api:latest
    container_name: mlops-aml-streaming
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      - "1000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow.db
      - AML_HMAC_KEY_VERSION=${AML_HMAC_KEY_VERSION:-v1}
      - AML_HMAC_SECRET_KEY=${AML_HMAC_SECRET_KEY:?AML_HMAC_SECRET_KEY must be set in .env or environment}
      - AML_PSEUDONYMIZE_ACCOUNTS=${AML_PSEUDONYMIZE_ACCOUNTS:-1}
      - AML_DAEMON_MODE=0
      - AML_WARMUP_EVENTS=100000
      - AML_MAX_EVENTS=100000
      - AML_STREAM_DELAY_SECONDS=0.0
    volumes:
      - ./mlflow.db:/mlflow.db:ro
      - ./project-3-aml-streaming/data:/app/data:ro
      - ./project-3-aml-streaming/artifacts:/app/artifacts
      - ./mlruns:/app/mlruns:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, os, time; hb='/app/artifacts/heartbeat.json'; assert time.time() - os.path.getmtime(hb) < 120 and json.load(open(hb)).get('status') == 'HEALTHY'\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: "no"

  airflow-standalone:
    image: apache/airflow:2.10.2
    container_name: mlops-airflow
    user: "${DOCKER_UID:-1000}:0"
    group_add:
      - "1000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./project-2-loan-default/src:/opt/airflow/project-2-loan-default/src:ro
      - ./project-2-loan-default/data/processed:/opt/airflow/project-2-loan-default/data/processed:ro
      - ./project-2-loan-default/artifacts:/opt/airflow/project-2-loan-default/artifacts
      - ./project-2-loan-default/docs:/opt/airflow/project-2-loan-default/docs
    environment:
      - HOME=/opt/airflow
      - PYTHONUSERBASE=/opt/airflow/.local
      - UMASK=0002
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _PIP_ADDITIONAL_REQUIREMENTS=pyarrow==25.0.1 httpx==0.28.1
      - EXPECTED_API_KEY=${EXPECTED_API_KEY:?EXPECTED_API_KEY must be set in .env or environment}
      - LOAN_API_URL=http://mlops-api-gateway:8081/api/v1/loan-sim/predict
    command: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mlflow-server:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/mlflow-server:latest
    container_name: mlops-mlflow-server
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    group_add:
      - "1000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlflow.db:/mlflow.db
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
