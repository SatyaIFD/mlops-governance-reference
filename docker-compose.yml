name: mlops-governance-reference
services:
  api-gateway:
    image: nginx:1.25-alpine
    container_name: mlops-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fraud-detection-api:
        condition: service_healthy
      loan-default-api:
        condition: service_healthy
    restart: unless-stopped

  fraud-detection-api:
    build:
      context: .
      dockerfile: project-1-credit-card-fraud/Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/fraud-detection-job:latest
    container_name: mlops-fraud-api
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow.db
    volumes:
      - ./mlflow.db:/mlflow.db
      - ./aml_streaming_model:/app/aml_streaming_model
      - ./mlruns:/home/satyajit/Work/mlops-governance-reference/mlruns
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  loan-default-api:
    build:
      context: .
      dockerfile: project-2-loan-default/Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/loan-default-job:latest
    container_name: mlops-loan-api
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow.db
    volumes:
      - ./mlflow.db:/mlflow.db
      - ./aml_streaming_model:/app/aml_streaming_model
      - ./mlruns:/home/satyajit/Work/mlops-governance-reference/mlruns
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  aml-streaming-api:
    build:
      context: .
      dockerfile: project-3-aml-streaming/Dockerfile
    image: ghcr.io/satyaifd/mlops-governance-reference/aml-stream-api:latest
    container_name: mlops-aml-streaming
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow.db
    volumes:
      - ./mlflow.db:/mlflow.db
      - ./aml_streaming_model:/app/aml_streaming_model
      - ./mlruns:/home/satyajit/Work/mlops-governance-reference/mlruns
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-standalone:
    image: apache/airflow:2.10.2
    container_name: mlops-airflow
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    command: standalone
    restart: unless-stopped

  mlflow-server:
    image: python:3.13-slim
    container_name: mlops-mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow.db
      - ./aml_streaming_model:/app/aml_streaming_model
      - ./mlruns:/home/satyajit/Work/mlops-governance-reference/mlruns
    command: /bin/bash -c "pip install mlflow && mlflow server --backend-store-uri sqlite:////mlflow.db --default-artifact-root /home/satyajit/Work/mlops-governance-reference/mlruns --host 0.0.0.0 --port 5000"
    restart: unless-stopped
