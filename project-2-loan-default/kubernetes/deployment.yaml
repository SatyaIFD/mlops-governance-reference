apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-prediction-deployment
  labels:
    app: loan-prediction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-prediction-api
  template:
    metadata:
      labels:
        app: loan-prediction-api
    spec:
      containers:
      - name: loan-prediction-container
        image: loan-prediction-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1.0"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10