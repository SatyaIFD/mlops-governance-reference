apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-prediction-deployment
  labels:
    app: loan-prediction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-prediction-api
  template:
    metadata:
      labels:
        app: loan-prediction-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: loan-prediction-container
        image: loan-prediction-service:v1
        imagePullPolicy: IfNotPresent
        # SECURE FIX: Enforce Restricted PSS Profile via SecurityContext
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1.0"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
