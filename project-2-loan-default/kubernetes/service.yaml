apiVersion: v1
kind: Service
metadata:
  name: loan-prediction-service
spec:
  type: ClusterIP
  selector:
    app: loan-prediction-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loan-prediction-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: loan-prediction-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loan-prediction-netpol
spec:
  podSelector:
    matchLabels:
      app: loan-prediction-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8000
